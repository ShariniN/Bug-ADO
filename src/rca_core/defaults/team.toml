# Team-wide defaults. Personal settings go in ~/.rca/config.toml and override these.

[ado]
org_url = ""
project = ""
pat_env = "ADO_PAT"
bug_type = ""          # "" = detect (Bug, else Issue); set to force a work item type name

[git]
release_branch_pattern = "release/(\\d+\\.\\d+)"
legacy_cutoff = "9.6"
current_pi = ""
default_target_branch = "main"

[tool]
repo_url = "https://github.com/ShariniN/Bug-ADO.git"   # git URL of this tool's repo, used for the update notice

[auth]
mode = "browser"       # "browser" = Microsoft sign-in (no setup needed); "pat" = personal access token in $pat_env
client_id = "04b07795-8ddb-461a-bbee-02f9e1bf7b46"   # Azure CLI public client (Microsoft-owned; no app registration needed). Override with your own registration if your tenant blocks it.
tenant_id = "organizations"                          # any work account; or your tenant id
persist_tokens = true  # false = keep the sign-in only in memory (sign in once per Claude Code session)

[fields]
summary = "Custom.RCASummary"
root_cause = "Custom.RootCause"
impact = "Custom.ImpactAssessment"
previous_versions = "Custom.PreviousVersions"
related_ids = "Custom.RelatedIdentifiers"
classification = "Custom.BugClassification"
preventive_action = "Custom.PreventiveAction"
lesson_learned = "Custom.LessonLearned"
analysis_method = "Custom.AnalysisMethod"
fix_description = "Custom.FixDescription"
impacted_area = "Custom.ImpactedArea"
culprit_commit = "Custom.CausingCommit"
why_missed = "Custom.WhyMissed"
